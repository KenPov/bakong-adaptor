services:
  bakong-adaptor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-nexus.sbibank.com/sbicore}/bakong-adaptor:${IMAGE_TAG:-uat-0.1.0}
    container_name: bakong-adaptor
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      # Profile & Server
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      SERVER_PORT: "${SERVER_PORT:-8082}"
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m}"

      # Bakong Open Banking Hub (SIT)
      BAKONG_OB_CLIENT_AUTH_URL: "${BAKONG_OB_CLIENT_AUTH_URL:-http://172.24.21.20:8080/v1/authenticate}"
      BAKONG_OB_CLIENT_ACCOUNT_INQUIRY_URL: "${BAKONG_OB_CLIENT_ACCOUNT_INQUIRY_URL:-http://172.24.21.20:8080/api/v1/account_inquiry/account}"
      BAKONG_OB_CLIENT_USERNAME: "${BAKONG_OB_CLIENT_USERNAME:-sbilh_app_sit}"
      BAKONG_OB_CLIENT_PASSWORD: "${BAKONG_OB_CLIENT_PASSWORD:-vw7w2bwqXEzLmAZ9uPN0}"

      # CIFTP Core Banking Adapter (SIT/UAT)
      CIFTP_API_URL: "${CIFTP_API_URL:-http://spguat.sbilhbank.com.kh:8765}"
      CIFTP_API_USER: "${CIFTP_API_USER:-spgapp}"
      CIFTP_API_PWD: "${CIFTP_API_PWD:-Spg@ppPa440rd23}"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
